name: Bug report
description: Something broke — sorry about that. Two fields and we're on it.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry it broke. Give us the version and what you asked, and we'll take it from there —
        new issues page the maintainer's phone in real time, so first response is typically
        within 1 business day.

        **Shortcut:** `npx ruvnet-brain --feedback` prefills your version, platform, and a
        3-line health summary for you (it opens a Discussion — paste the block here instead
        if it's clearly a bug).
  - type: textarea
    id: what-happened
    attributes:
      label: What you asked, and what happened instead
      description: The prompt or command you ran, and what came back (or didn't).
      placeholder: 'I asked "…" / ran `npx ruvnet-brain --…` and got …'
    validations:
      required: true
  - type: textarea
    id: version-health
    attributes:
      label: Version + health
      description: >-
        Paste the output of `npx ruvnet-brain --doctor` (or the prefilled block from
        `npx ruvnet-brain --feedback`). Both contain nothing private — versions, platform,
        and green/red checks only.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / platform (if not in the paste above)
      placeholder: e.g. macOS 15 arm64, Windows 11, Ubuntu 24.04
    validations:
      required: false

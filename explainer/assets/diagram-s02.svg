<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="s02-title s02-desc">
  <title id="s02-title">The 9-month gap: rUv builds at the front edge today; it reaches mainstream tooling and Claude Code about nine months later, while Claude reasons from its older training horizon</title>
  <desc id="s02-desc">A timeline shows rUv's work at the front edge today on the left, a roughly nine-month arrow to the right where the same ideas land in mainstream AI tooling and Claude Code, and a lower dotted band marking Claude's training horizon in the public past. Because Claude reasons from that older horizon, asking it about a present-day rUv tool is asking about its own future, so it defaults to the past and drifts.</desc>
  <defs>
    <linearGradient id="s02-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="s02-arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a830"/>
      <stop offset="100%" stop-color="#5ad6ff"/>
    </linearGradient>
    <filter id="s02-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="s02-ac" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5ad6ff"/></marker>
    <marker id="s02-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff6b5e"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="480" rx="14" fill="url(#s02-bg)"/>
  <text x="500" y="40" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="22" font-weight="700">The 9-month gap</text>
  <text x="500" y="64" text-anchor="middle" fill="#8b8f9c" font-family="system-ui,sans-serif" font-size="13">rUv works ahead of the frontier — so today's front-edge tool is Claude's future</text>

  <!-- front edge node -->
  <g filter="url(#s02-glow)" opacity=".55"><rect x="70" y="104" width="246" height="116" rx="12" fill="rgba(240,168,48,.18)"/></g>
  <rect x="70" y="104" width="246" height="116" rx="12" fill="#11161f" stroke="rgba(240,168,48,.5)" stroke-width="1.5"/>
  <text x="193" y="134" text-anchor="middle" fill="#f0a830" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" font-weight="600">THE FRONT EDGE · TODAY</text>
  <text x="193" y="164" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="20" font-weight="700">rUv builds it</text>
  <text x="193" y="190" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12.5">the prototypes of tomorrow's</text>
  <text x="193" y="207" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12.5">mainstream AI tooling</text>

  <!-- 9 month arrow -->
  <text x="474" y="146" text-anchor="middle" fill="#ffce6a" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1">≈ 9 MONTHS</text>
  <line x1="322" y1="162" x2="624" y2="162" stroke="url(#s02-arrow)" stroke-width="3" marker-end="url(#s02-ac)"/>
  <text x="474" y="186" text-anchor="middle" fill="#8b8f9c" font-family="system-ui,sans-serif" font-size="12">becomes mainstream</text>

  <!-- mainstream / claude code node -->
  <rect x="632" y="104" width="288" height="116" rx="12" fill="#11161f" stroke="rgba(90,214,255,.45)" stroke-width="1.5"/>
  <text x="776" y="134" text-anchor="middle" fill="#5ad6ff" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" font-weight="600">~9 MONTHS LATER</text>
  <text x="776" y="164" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="19" font-weight="700">Mainstream &amp; Claude Code</text>
  <text x="776" y="190" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12.5">the same ideas ship to everyone —</text>
  <text x="776" y="207" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12.5">8–9 months after rUv</text>

  <!-- training horizon band -->
  <line x1="193" y1="220" x2="193" y2="296" stroke="#ff6b5e" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#s02-ar)"/>
  <text x="214" y="262" fill="#ff6b5e" font-family="system-ui,sans-serif" font-size="12">Claude doesn't reason from here…</text>

  <rect x="70" y="300" width="850" height="96" rx="12" fill="#0f141c" stroke="rgba(232,228,216,.14)" stroke-dasharray="6 5"/>
  <text x="92" y="328" fill="#a39d8c" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5">CLAUDE'S TRAINING HORIZON · THE PUBLIC PAST</text>
  <text x="92" y="354" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="13.5">…it reasons from millions of classical-dev examples — the history of software up to its cutoff.</text>
  <text x="92" y="378" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="13.5">So it can't <tspan fill="#ece8dc" font-weight="700">see</tspan> the front edge. It doubts it, substitutes the old way, and talks you back.</text>

  <text x="500" y="436" text-anchor="middle" fill="#f0a830" font-family="Georgia,serif" font-size="15.5" font-style="italic">Not Claude being dumb — a training-horizon problem. The Brain closes the gap.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="s01-title s01-desc">
  <title id="s01-title">One question, two paths: without the Brain Claude drifts to Pinecone, with the Brain it grounds in rUv's RVF source</title>
  <desc id="s01-desc">The same request — set up vector search with RuVector — splits into two paths. Without the Brain, Claude has never been trained on RuVector, falls back to Pinecone, pgvector or hand-rolled cosine, and even argues for a managed database, ending up far from rUv's stack. With the Brain, Claude reads rUv's real RuVector source first, sees RVF binary vector files plus HNSW, and writes the correct RvfDatabase open and query code on the first try.</desc>
  <defs>
    <linearGradient id="s01-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <filter id="s01-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="s01-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff6b5e"/></marker>
    <marker id="s01-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5fd38a"/></marker>
    <marker id="s01-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b8f9c"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="14" fill="url(#s01-bg)"/>
  <text x="500" y="40" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="22" font-weight="700">One question — two very different paths</text>

  <!-- the question -->
  <rect x="312" y="64" width="376" height="62" rx="11" fill="#11161f" stroke="rgba(240,168,48,.45)" stroke-width="1.4"/>
  <text x="500" y="89" text-anchor="middle" fill="#8b8f9c" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">YOU ASK</text>
  <text x="500" y="111" text-anchor="middle" fill="#ece8dc" font-family="system-ui,sans-serif" font-size="14.5">“Set up vector search using RuVector.”</text>

  <!-- fork lines -->
  <path d="M430 126 C360 150 300 158 250 176" stroke="#ff6b5e" stroke-width="1.8" fill="none" marker-end="url(#s01-ar)"/>
  <path d="M570 126 C640 150 700 158 750 176" stroke="#5fd38a" stroke-width="1.8" fill="none" marker-end="url(#s01-ag)"/>

  <!-- LEFT: drift -->
  <rect x="58" y="180" width="384" height="150" rx="11" fill="#0f141c" stroke="rgba(255,107,94,.32)" stroke-width="1.3"/>
  <text x="80" y="206" fill="#ff6b5e" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" font-weight="600">WITHOUT THE BRAIN — DRIFT</text>
  <text x="80" y="232" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="13">Never trained on RuVector, so it falls back to</text>
  <text x="80" y="252" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="13">classical habits — Pinecone, pgvector, or</text>
  <text x="80" y="272" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="13">hand-rolled cosine over JSON.</text>
  <text x="80" y="304" fill="#ff8a7e" font-family="Georgia,serif" font-size="13.5" font-style="italic">“a managed vector DB would be more standard…”</text>

  <path d="M250 330 V348" stroke="#ff6b5e" stroke-width="1.8" fill="none" marker-end="url(#s01-ar)"/>
  <rect x="104" y="352" width="292" height="66" rx="10" fill="#170f10" stroke="rgba(255,107,94,.5)" stroke-width="1.3"/>
  <text x="250" y="380" text-anchor="middle" fill="#ff6b5e" font-family="system-ui,sans-serif" font-size="14" font-weight="700">Far from rUv's stack</text>
  <text x="250" y="401" text-anchor="middle" fill="#a39d8c" font-family="system-ui,sans-serif" font-size="12">slower · heavier · wrong</text>

  <!-- RIGHT: grounded -->
  <g filter="url(#s01-glow)" opacity=".5"><rect x="560" y="352" width="380" height="66" rx="10" fill="rgba(95,211,138,.16)"/></g>
  <rect x="558" y="180" width="384" height="150" rx="11" fill="#0f141c" stroke="rgba(95,211,138,.36)" stroke-width="1.3"/>
  <text x="580" y="206" fill="#5fd38a" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5" font-weight="600">WITH THE BRAIN — GROUNDED</text>
  <text x="580" y="232" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="13">Reads rUv's real RuVector source first and</text>
  <text x="580" y="252" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="13">sees RVF binary vector files + HNSW.</text>
  <rect x="580" y="266" width="342" height="44" rx="7" fill="#08090b" stroke="rgba(90,214,255,.3)"/>
  <text x="598" y="294" fill="#5ad6ff" font-family="ui-monospace,monospace" font-size="13">RvfDatabase.open(..).query(query, 10)</text>

  <path d="M750 330 V348" stroke="#5fd38a" stroke-width="1.8" fill="none" marker-end="url(#s01-ag)"/>
  <rect x="604" y="352" width="292" height="66" rx="10" fill="#0d1611" stroke="rgba(95,211,138,.55)" stroke-width="1.3"/>
  <text x="750" y="380" text-anchor="middle" fill="#5fd38a" font-family="system-ui,sans-serif" font-size="14" font-weight="700">The front-edge version, first try</text>
  <text x="750" y="401" text-anchor="middle" fill="#a39d8c" font-family="system-ui,sans-serif" font-size="12">correct · the way rUv would · no argument</text>

  <!-- aha -->
  <rect x="120" y="452" width="760" height="74" rx="11" fill="#11161f" stroke="rgba(240,168,48,.3)"/>
  <text x="500" y="483" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="16" font-weight="700">It doesn't make Claude smarter.</text>
  <text x="500" y="508" text-anchor="middle" fill="#f0a830" font-family="Georgia,serif" font-size="15" font-style="italic">It makes Claude stop guessing — and read rUv's actual code.</text>
</svg>

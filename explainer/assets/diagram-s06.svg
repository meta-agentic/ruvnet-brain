<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="s06-title s06-desc">
  <title id="s06-title">Coverage map: roughly eighteen of rUv's building blocks gathered into one Brain</title>
  <desc id="s06-desc">A central Brain hub fans out to a grid of eighteen building blocks, each shown gathered and read: ruflo, RuVector, AgentDB, RuLake, RuView, agentic-flow, SPARC, QuDAG, SAFLA, ruv-fann, SynthLang, rupixel, agenticow, metaharness, daa, dspy.ts, FACT and cve-bench. Together they show the reassuring breadth of the ecosystem indexed in one place.</desc>
  <defs>
    <linearGradient id="s06-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="s06-hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0a830" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#f0a830" stop-opacity="0"/>
    </radialGradient>
    <filter id="s06-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="560" rx="14" fill="url(#s06-bg)"/>
  <text x="500" y="40" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="22" font-weight="700">Everything gathered into one Brain</text>
  <text x="500" y="64" text-anchor="middle" fill="#8b8f9c" font-family="system-ui,sans-serif" font-size="13">18 building blocks · 75,509 source chunks · all read, nothing for you to chase down</text>

  <!-- constellation lines from hub to row 1 -->
  <g stroke="rgba(90,214,255,.22)" stroke-width="1" fill="none">
    <path d="M500 130 L113 218"/><path d="M500 130 L267 218"/><path d="M500 130 L421 218"/>
    <path d="M500 130 L575 218"/><path d="M500 130 L729 218"/><path d="M500 130 L883 218"/>
  </g>

  <!-- hub -->
  <circle cx="500" cy="124" r="58" fill="url(#s06-hub)"/>
  <circle cx="500" cy="124" r="34" fill="#11161f" stroke="#f0a830" stroke-width="1.8"/>
  <g stroke="#f0a830" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M500 100v48"/><path d="M486 107c-9 5-9 16 0 21s9 16 0 21"/><path d="M514 107c9 5 9 16 0 21s-9 16 0 21"/>
  </g>
  <text x="500" y="196" text-anchor="middle" fill="#f0a830" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.5">THE RUVNET BRAIN</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="s03-title s03-desc">
  <title id="s03-title">Why others failed and why this one passes: flat JSON name-matching drifts, while real source plus RVF, dual embeddings and capability cards routes correctly every time</title>
  <desc id="s03-desc">Side by side. The failing architecture on the left: flat JSON embeddings, naive retrieval that matches on repo names, so a query that does not name the repo returns nothing useful — brittle, shallow, drifting. The passing architecture on the right: 75,509 chunks of rUv's real source, RVF binary files with real HNSW and dual embeddings, plus capability cards describing what each tool is for, which routes to the right repo every time even when only described, lifting routing from 33 percent to 96 percent.</desc>
  <defs>
    <linearGradient id="s03-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <filter id="s03-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="s03-ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff6b5e"/></marker>
    <marker id="s03-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5fd38a"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="540" rx="14" fill="url(#s03-bg)"/>
  <text x="500" y="40" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="22" font-weight="700">Why others failed — and why this one passes</text>
  <line x1="500" y1="64" x2="500" y2="470" stroke="rgba(232,228,216,.1)" stroke-dasharray="3 7"/>

  <!-- LEFT — fails -->
  <text x="250" y="86" text-anchor="middle" fill="#ff6b5e" font-family="ui-monospace,monospace" font-size="12.5" letter-spacing="1" font-weight="600">THEIR ARCHITECTURE — FAILS</text>
  <rect x="60" y="100" width="380" height="54" rx="10" fill="#0f141c" stroke="rgba(232,228,216,.16)"/>
  <text x="250" y="132" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="14">Flat JSON embeddings</text>
  <line x1="250" y1="154" x2="250" y2="174" stroke="#ff6b5e" stroke-width="1.6" marker-end="url(#s03-ar)"/>
  <rect x="60" y="176" width="380" height="54" rx="10" fill="#0f141c" stroke="rgba(232,228,216,.16)"/>
  <text x="250" y="208" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="14">Naive RAG · match on repo <tspan fill="#ece8dc" font-weight="700">names</tspan></text>
  <line x1="250" y1="230" x2="250" y2="250" stroke="#ff6b5e" stroke-width="1.6" marker-end="url(#s03-ar)"/>
  <rect x="60" y="252" width="380" height="62" rx="10" fill="#170f10" stroke="rgba(255,107,94,.45)"/>
  <text x="250" y="278" text-anchor="middle" fill="#ff6b5e" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700">Don't know the name? Nothing useful.</text>
  <text x="250" y="299" text-anchor="middle" fill="#a39d8c" font-family="system-ui,sans-serif" font-size="12">“cheap LLM routing” → 0 results</text>
  <line x1="250" y1="314" x2="250" y2="334" stroke="#ff6b5e" stroke-width="1.6" marker-end="url(#s03-ar)"/>
  <rect x="100" y="336" width="300" height="68" rx="10" fill="#150d0e" stroke="rgba(255,107,94,.5)"/>
  <text x="250" y="366" text-anchor="middle" fill="#ff6b5e" font-family="Georgia,serif" font-size="17" font-weight="700">✗ Brittle · shallow · drifts</text>
  <text x="250" y="389" text-anchor="middle" fill="#a39d8c" font-family="system-ui,sans-serif" font-size="12">name-blind queries fall through</text>

  <!-- RIGHT — passes -->
  <text x="750" y="86" text-anchor="middle" fill="#5fd38a" font-family="ui-monospace,monospace" font-size="12.5" letter-spacing="1" font-weight="600">THIS ARCHITECTURE — PASSES</text>
  <rect x="560" y="100" width="380" height="54" rx="10" fill="#0f141c" stroke="rgba(95,211,138,.28)"/>
  <text x="750" y="125" text-anchor="middle" fill="#ece8dc" font-family="system-ui,sans-serif" font-size="13.5"><tspan font-weight="700">75,509 chunks</tspan> of rUv's real source</text>
  <text x="750" y="143" text-anchor="middle" fill="#8b8f9c" font-family="system-ui,sans-serif" font-size="11.5">the code, not a blog about the code</text>
  <line x1="750" y1="154" x2="750" y2="174" stroke="#5fd38a" stroke-width="1.6" marker-end="url(#s03-ag)"/>
  <rect x="560" y="176" width="380" height="54" rx="10" fill="#0f141c" stroke="rgba(90,214,255,.3)"/>
  <text x="750" y="201" text-anchor="middle" fill="#5ad6ff" font-family="system-ui,sans-serif" font-size="13.5">RVF binary files · real HNSW</text>
  <text x="750" y="219" text-anchor="middle" fill="#8b8f9c" font-family="system-ui,sans-serif" font-size="11.5">dual embeddings (MiniLM-384 + bge-768) + rerank</text>
  <line x1="750" y1="230" x2="750" y2="250" stroke="#5fd38a" stroke-width="1.6" marker-end="url(#s03-ag)"/>
  <g filter="url(#s03-glow)" opacity=".45"><rect x="560" y="252" width="380" height="62" rx="10" fill="rgba(240,168,48,.16)"/></g>
  <rect x="560" y="252" width="380" height="62" rx="10" fill="#161208" stroke="rgba(240,168,48,.5)"/>
  <text x="750" y="278" text-anchor="middle" fill="#f0a830" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700">Capability cards — the breakthrough</text>
  <text x="750" y="299" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12">“what this tool is FOR” → route by need, not name</text>
  <line x1="750" y1="314" x2="750" y2="334" stroke="#5fd38a" stroke-width="1.6" marker-end="url(#s03-ag)"/>
  <g filter="url(#s03-glow)" opacity=".5"><rect x="600" y="336" width="300" height="68" rx="10" fill="rgba(95,211,138,.18)"/></g>
  <rect x="600" y="336" width="300" height="68" rx="10" fill="#0d1611" stroke="rgba(95,211,138,.55)"/>
  <text x="750" y="366" text-anchor="middle" fill="#5fd38a" font-family="Georgia,serif" font-size="17" font-weight="700">✓ Right repo every time</text>
  <text x="750" y="389" text-anchor="middle" fill="#ece8dc" font-family="system-ui,sans-serif" font-size="12.5">by description: <tspan fill="#ff6b5e" font-weight="700">33%</tspan> → <tspan fill="#5fd38a" font-weight="700">96%</tspan></text>

  <!-- honest footer -->
  <rect x="120" y="442" width="760" height="64" rx="11" fill="#11161f" stroke="rgba(95,211,138,.3)"/>
  <text x="500" y="470" text-anchor="middle" fill="#5fd38a" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="1.5">NOT MAGIC — MEASURED</text>
  <text x="500" y="492" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="14.5" font-style="italic">The boring-but-correct architecture rUv would use — and we measured the jump.</text>
</svg>

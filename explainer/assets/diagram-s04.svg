<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="s04-title s04-desc">
  <title id="s04-title">The grounding loop: every prompt triggers a hook that tells Claude to check rUv's source, search_ruvnet pulls the real passage from the Brain, and a cited grounded answer returns to you — on every turn</title>
  <desc id="s04-desc">A loop. Your prompt goes to a grounding hook that fires on every message, telling Claude to ground in rUv's real source before asserting anything. The search_ruvnet tool pulls the exact source passage from the Brain stored in RVF. A grounded answer with a citation returns to you. A return arc shows the loop never skips, so Claude cannot fall asleep at the switch.</desc>
  <defs>
    <linearGradient id="s04-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <filter id="s04-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="s04-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8b8f9c"/></marker>
    <marker id="s04-ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5fd38a"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="440" rx="14" fill="url(#s04-bg)"/>
  <text x="500" y="38" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="22" font-weight="700">The grounding loop — automatic, never asleep</text>
  <text x="500" y="62" text-anchor="middle" fill="#8b8f9c" font-family="system-ui,sans-serif" font-size="13">You don't call anything. You don't remember anything. It runs on every prompt.</text>

  <!-- 1 you -->
  <rect x="44" y="100" width="190" height="150" rx="12" fill="#0f141c" stroke="rgba(232,228,216,.18)"/>
  <text x="139" y="128" text-anchor="middle" fill="#8b8f9c" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="1.5">STEP 1</text>
  <text x="139" y="156" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="18" font-weight="700">Your prompt</text>
  <text x="139" y="184" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12.5">you just talk to</text>
  <text x="139" y="201" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12.5">Claude like normal</text>

  <line x1="234" y1="175" x2="262" y2="175" stroke="#8b8f9c" stroke-width="2" marker-end="url(#s04-a)"/>

  <!-- 2 hook -->
  <g filter="url(#s04-glow)" opacity=".45"><rect x="264" y="100" width="210" height="150" rx="12" fill="rgba(240,168,48,.15)"/></g>
  <rect x="264" y="100" width="210" height="150" rx="12" fill="#161208" stroke="rgba(240,168,48,.5)" stroke-width="1.4"/>
  <text x="369" y="128" text-anchor="middle" fill="#f0a830" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="1.5">STEP 2 · THE HOOK</text>
  <text x="369" y="156" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="17" font-weight="700">Grounding hook fires</text>
  <text x="369" y="184" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12">injects, every message:</text>
  <text x="369" y="203" text-anchor="middle" fill="#f0a830" font-family="system-ui,sans-serif" font-size="12" font-style="italic">“check rUv's source</text>
  <text x="369" y="220" text-anchor="middle" fill="#f0a830" font-family="system-ui,sans-serif" font-size="12" font-style="italic">before you assert”</text>

  <line x1="474" y1="175" x2="502" y2="175" stroke="#8b8f9c" stroke-width="2" marker-end="url(#s04-a)"/>

  <!-- 3 search brain -->
  <rect x="504" y="100" width="210" height="150" rx="12" fill="#0f141c" stroke="rgba(90,214,255,.45)" stroke-width="1.4"/>
  <text x="609" y="128" text-anchor="middle" fill="#5ad6ff" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="1.5">STEP 3 · SEARCH</text>
  <text x="609" y="156" text-anchor="middle" fill="#5ad6ff" font-family="ui-monospace,monospace" font-size="15" font-weight="700">search_ruvnet</text>
  <text x="609" y="184" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12">pulls the exact source</text>
  <text x="609" y="201" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12">passage from the Brain</text>
  <text x="609" y="222" text-anchor="middle" fill="#8b8f9c" font-family="ui-monospace,monospace" font-size="11">RVF · 75,509 chunks</text>

  <line x1="714" y1="175" x2="742" y2="175" stroke="#8b8f9c" stroke-width="2" marker-end="url(#s04-a)"/>

  <!-- 4 grounded answer -->
  <g filter="url(#s04-glow)" opacity=".5"><rect x="744" y="100" width="210" height="150" rx="12" fill="rgba(95,211,138,.16)"/></g>
  <rect x="744" y="100" width="210" height="150" rx="12" fill="#0d1611" stroke="rgba(95,211,138,.55)" stroke-width="1.4"/>
  <text x="849" y="128" text-anchor="middle" fill="#5fd38a" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing="1.5">STEP 4 · ANSWER</text>
  <text x="849" y="156" text-anchor="middle" fill="#ece8dc" font-family="Georgia,serif" font-size="17" font-weight="700">Grounded answer</text>
  <text x="849" y="184" text-anchor="middle" fill="#c3c2b6" font-family="system-ui,sans-serif" font-size="12">rUv's real code attached</text>
  <text x="849" y="205" text-anchor="middle" fill="#5fd38a" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">a citation, not a guess</text>

  <!-- return loop -->
  <path d="M849 250 V356 Q849 372 833 372 H155 Q139 372 139 356 V250" fill="none" stroke="#5fd38a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#s04-ag)"/>
  <rect x="372" y="356" width="256" height="30" rx="8" fill="#0b1018"/>
  <text x="500" y="376" text-anchor="middle" fill="#5fd38a" font-family="system-ui,sans-serif" font-size="13" font-weight="700">the loop never skips — every turn</text>

  <text x="500" y="416" text-anchor="middle" fill="#f0a830" font-family="Georgia,serif" font-size="15" font-style="italic">Claude can't fall asleep at the switch — it's reminded every single message.</text>
</svg>

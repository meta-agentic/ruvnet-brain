      <stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#2c3850" stroke-width="1.5"/>
  <path d="M25 48 C17 48 11.5 41.5 13.5 34.5 C10 29 13 21 19 19 C21 12.5 29 9.5 35 12 C43 9 50.5 14.5 50.5 22 C55 26 55 34.5 50 38 C49 43.5 43 47.5 37 46.5 L31 47.5 Z"
        fill="none" stroke="#f0a830" stroke-width="3.4" stroke-linejoin="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RuvNet Brain">
  <!-- Version-free identity mark (2026-07-16): the old favicon was a numeral "3" — a version
       claim baked into pixels, same disease as the VERSION 2.0 og image. This mark is the
       brain as a circuit: amber outline, three signal nodes in the console's own semantics
       (cyan = observed, amber = acting, green = grounded). Nothing here can go stale. -->

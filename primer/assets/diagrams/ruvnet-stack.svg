<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="660" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">The RuvNet Stack — how it all hangs together</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#64748b">RVF is the file format · RuVector is the engine · everything above is a consumer</text>

  <!-- Layer 1: Apps -->
  <rect x="60" y="84" width="780" height="86" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="80" y="108" font-size="13" font-weight="700" fill="#0369a1">APPS &amp; PRODUCTS</text>
  <text x="80" y="134" font-size="14" fill="#0f172a">RuView (WiFi → spatial intelligence)　·　Cognitum (device)　·　your app　·　marketing</text>
  <text x="80" y="156" font-size="12" fill="#475569">built on the orchestration + engine below</text>

  <!-- arrow -->
  <line x1="450" y1="170" x2="450" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="462" y="188" font-size="11" fill="#64748b">build on</text>

  <!-- Layer 2: Orchestration -->
  <rect x="60" y="198" width="780" height="86" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="80" y="222" font-size="13" font-weight="700" fill="#6d28d9">ORCHESTRATION</text>
  <text x="80" y="248" font-size="14" fill="#0f172a">ruflo — agent meta-harness: swarms · hooks · MCP tools · memory · guidance</text>
  <text x="80" y="270" font-size="12" fill="#475569">agentic-flow · agent-harness-generator · SPARC · DAA</text>

  <line x1="450" y1="284" x2="450" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="462" y="302" font-size="11" fill="#64748b">coordinate over</text>

  <!-- Layer 3: Memory & Cache -->
  <rect x="60" y="312" width="780" height="80" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="80" y="336" font-size="13" font-weight="700" fill="#15803d">MEMORY &amp; CACHE</text>
  <text x="80" y="362" font-size="14" fill="#0f172a">AgentDB (smart vector memory)　·　RuLake (cache-coherent vector fabric)</text>

  <line x1="450" y1="392" x2="450" y2="418" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="462" y="410" font-size="11" fill="#64748b">persist / serve vectors via</text>

  <!-- Layer 4: Engine -->
  <rect x="60" y="420" width="780" height="124" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="444" font-size="13" font-weight="700" fill="#b45309">THE ENGINE — RuVector (1.58M lines, Rust)</text>
  <text x="80" y="470" font-size="14" fill="#0f172a">HNSW vector search · GNN self-learning · graph + Cypher · coherence / min-cut gates</text>
  <text x="80" y="492" font-size="14" fill="#0f172a">sublinear solvers · ruvllm (local LLM) · attention · WASM / edge</text>
  <text x="80" y="522" font-size="12" font-weight="600" fill="#92400e">delivered as: RVF files (.rvf = vectors + index + witness in one) · crates.io + npm · PostgreSQL ext</text>

  <!-- Specialized band -->
  <rect x="60" y="568" width="780" height="68" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="592" font-size="13" font-weight="700" fill="#334155">SPECIALIZED ON THE ENGINE</text>
  <text x="80" y="616" font-size="13" fill="#0f172a">QuDAG · ruv-FANN · Synaptic-Mesh · rvm · midstream · sublinear-time-solver · rvcsi/rufield · ruqu · rvdna</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>

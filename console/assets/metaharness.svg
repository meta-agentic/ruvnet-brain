<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mh-t mh-d">
  <title id="mh-t">MetaHarness: freeze the model, evolve the harness</title>
  <desc id="mh-d">A frozen crystalline core labeled MODEL sits motionless at the centre — the same Claude you already have, never retrained, never swapped. Around it orbits a living amber harness ring carrying seven policy surfaces: planner, contextBuilder, reviewer, retryPolicy, toolPolicy, memoryPolicy and scorePolicy. A comet of activity sweeps the ring, visiting one surface at a time — the Darwin loop mutates one surface, sandboxes it, and keeps only what measurably improves. A green variant branch merges back into the harness (kept); a red one fades (pruned). The harness stands on four pillars: route (cost-optimal model selection), evolve (self-improving harness), orchestrate (agents, swarms, MCP) and verify (provenance plus safety gate). Payoff: a cheap model in a good harness approximately equals a frontier model, for less — per agentic-flow's ADR-076, 28.5 percent cheaper at 98.1 percent bar-compliance.</desc>

  <!-- Grounded in agentic-flow ADR-075 (seven surfaces, freeze/evolve) and ADR-076 (four pillars); 28.5% / 98.1% per agentic-flow ADR-076 (Accepted). -->

  <style>
    :root{
      --bg:#faf8f3; --ink:#1a1d24; --muted:#5c6170; --faint:#8b8f9b; --ridge:#dcd8cc;
      --amber:#9c6606; --amber-stroke:#c1830e; --amber-hi:#e29a12;
      --cyan:#146e93; --green:#1e7d47; --red:#c23325;
      --core-fill:#e9f1f6; --facet:#a5c6d8;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0a0c10; --ink:#ece8dc; --muted:#8f94a1; --faint:#5a5f6e; --ridge:#2a3140;
        --amber:#f0a830; --amber-stroke:#f0a830; --amber-hi:#ffc55e;
        --cyan:#5ad6ff; --green:#5fd38a; --red:#ff6b5e;
        --core-fill:#0d1c29; --facet:#24455a;
      }
    }

    .mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .serif{ font-family: "Iowan Old Style", Palatino, Georgia, serif; }
    /* halo: knocks background out behind text so lines may pass beneath labels */
    .hl{ paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
    .hlc{ paint-order: stroke; stroke: var(--core-fill); stroke-width: 6px; stroke-linejoin: round; }

    .node{ fill: var(--bg); stroke: var(--amber-stroke); stroke-width: 2; }
    .comet, .comet-glow{ opacity: 0; }               /* only alive when motion is allowed */
    .pruned-g{ opacity: .5; }                        /* at rest: the pruned variant reads as faded */

    /* ============ MOTION (the harness is alive; the model NEVER moves) ============ */
    @media (prefers-reduced-motion: no-preference){

      .texture{ animation: drift 26s linear infinite; }
      @keyframes drift{ to{ stroke-dashoffset: -70; } }

      .comet{ opacity: 1; animation: comet 14s linear infinite; }
      .comet-glow{ opacity: .28; animation: comet 14s linear infinite; }
      @keyframes comet{ to{ stroke-dashoffset: -829.38; } }

      .node{ transform-box: fill-box; transform-origin: center;
             animation: nodeHit 14s ease-out infinite; }
      .n-reviewer{ animation-delay: -.16s } .n-retry{ animation-delay: 1.84s }
      .n-tool{ animation-delay: 3.84s }    .n-memory{ animation-delay: 5.84s }
      .n-score{ animation-delay: 7.84s }   .n-planner{ animation-delay: 9.84s }
      .n-context{ animation-delay: 11.84s }
      @keyframes nodeHit{
        0%, 7%, 100%{ transform: scale(1);    stroke: var(--amber-stroke); fill: var(--bg); }
        1.5%        { transform: scale(1.45); stroke: var(--amber-hi);     fill: var(--amber-hi); }
      }

      .branch-kept{ stroke-dasharray: 100 100; animation: keptDraw 14s linear infinite; }
      @keyframes keptDraw{
        0%   { stroke-dashoffset: 100; opacity: 0; }
        2.8% { stroke-dashoffset: 100; opacity: 1; }
        11%  { stroke-dashoffset: 0;   opacity: 1; }
        88%  { stroke-dashoffset: 0;   opacity: 1; }
        94%, 100%{ stroke-dashoffset: 0; opacity: 0; }
      }
      .kept-mark{ animation: keptMark 14s ease infinite; }
      @keyframes keptMark{ 0%,12%{ opacity:0 } 17%,88%{ opacity:1 } 94%,100%{ opacity:0 } }

      .pruned-g{ animation: prunedFade 14s linear infinite; }
      @keyframes prunedFade{
        0%,19%{ opacity:0 } 23%,33%{ opacity:1 } 42%,86%{ opacity:.42 } 93%,100%{ opacity:0 }
      }
      .branch-pruned{ stroke-dasharray: 100 100; animation: prunedDraw 14s linear infinite; }
      @keyframes prunedDraw{ 0%,20%{ stroke-dashoffset:100 } 29%,100%{ stroke-dashoffset:0 } }
      .pruned-x{ transform-box: fill-box; transform-origin: center;
                 animation: prunedX 14s linear infinite; }
      @keyframes prunedX{ 0%,28%{ transform:scale(0) } 33%,100%{ transform:scale(1) } }

      .bar{ animation: barPulse 14s ease infinite; }
      .bar-1{ animation-delay:.8s } .bar-2{ animation-delay:4.3s }
      .bar-3{ animation-delay:7.8s } .bar-4{ animation-delay:11.3s }
      @keyframes barPulse{ 0%,12%,100%{ opacity:.45 } 4%{ opacity:1 } }
    }
  </style>

  <defs>
    <radialGradient id="mh-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  style="stop-color:var(--cyan)" stop-opacity=".13"/>
      <stop offset="70%" style="stop-color:var(--cyan)" stop-opacity=".05"/>
      <stop offset="100%" style="stop-color:var(--cyan)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="var(--bg)"/>

  <!-- title: temperature IS the thesis — cold model, warm harness -->
  <text x="450" y="30" class="mono" font-size="13.5" letter-spacing="3" text-anchor="middle">
    <tspan fill="var(--cyan)">FREEZE THE MODEL</tspan><tspan fill="var(--faint)"> · </tspan><tspan fill="var(--amber)">EVOLVE THE HARNESS</tspan>
  </text>

  <!-- corner captions -->
  <g class="mono">
    <text x="24" y="62"  font-size="12" letter-spacing="1.5" fill="var(--amber)">THE HARNESS</text>
    <text x="24" y="80"  font-size="12" fill="var(--muted)">seven policy surfaces,</text>
    <text x="24" y="97"  font-size="12" fill="var(--muted)">each mutated, then measured</text>
    <text x="24" y="115" font-size="12" fill="var(--faint)">agentic-flow ADR-075 · ADR-076</text>

    <text x="876" y="62"  font-size="12" letter-spacing="1.5" fill="var(--green)" text-anchor="end">THE DARWIN LOOP</text>
    <text x="876" y="80"  font-size="12" fill="var(--muted)" text-anchor="end">mutates one surface at a time,</text>
    <text x="876" y="97"  font-size="12" fill="var(--muted)" text-anchor="end">sandboxes it, keeps only what</text>
    <text x="876" y="114" font-size="12" fill="var(--muted)" text-anchor="end">measurably improves</text>
  </g>

  <!-- cold aura around the frozen core (static) -->
  <circle cx="450" cy="232" r="118" fill="url(#mh-aura)"/>

  <!-- the harness ring: fine circulating texture + main orbit + sweeping comet -->
  <circle class="texture" cx="450" cy="232" r="138" fill="none"
          stroke="var(--amber-stroke)" stroke-width="1" stroke-dasharray="2 5" opacity=".22"/>
  <circle cx="450" cy="232" r="132" fill="none"
          stroke="var(--amber-stroke)" stroke-width="1.6" opacity=".5"/>
  <circle class="comet-glow" cx="450" cy="232" r="132" fill="none"
          stroke="var(--amber-hi)" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="78 751.38"/>
  <circle class="comet" cx="450" cy="232" r="132" fill="none"
          stroke="var(--amber-hi)" stroke-width="2.6" stroke-linecap="round"
          stroke-dasharray="78 751.38"/>

  <!-- the evolution vignette: a variant of `reviewer` branches out, is measured,
       and either merges back into the harness (kept) or dies (pruned) -->
  <path class="branch-kept" pathLength="100" d="M585 268 C613 279 626 299 612 314 C600 327 570 338 528 339"
        fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linecap="round"/>
  <g class="kept-mark">
    <circle cx="527" cy="340" r="3.6" fill="var(--green)"/>
    <path d="M630 296 l5 6 l10 -12" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="652" y="301" class="mono hl" font-size="12"><tspan fill="var(--green)">kept</tspan><tspan fill="var(--muted)"> — measurably better</tspan></text>
  </g>
  <g class="pruned-g">
    <path class="branch-pruned" pathLength="100" d="M585 255 C610 249 634 237 649 219"
          fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"/>
    <g class="pruned-x">
      <path d="M650 207 L660 217 M660 207 L650 217" stroke="var(--red)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <text x="670" y="216" class="mono hl" font-size="12"><tspan fill="var(--red)">pruned</tspan><tspan fill="var(--muted)"> — didn't improve</tspan></text>
  </g>

  <!-- seven policy surfaces: stations on the living ring -->
  <circle class="node n-planner"  cx="450" cy="100" r="8"/>
  <circle class="node n-context"  cx="553" cy="150" r="8"/>
  <circle class="node n-reviewer" cx="579" cy="261" r="8"/>
  <circle class="node n-retry"    cx="507" cy="351" r="8"/>
  <circle class="node n-tool"     cx="393" cy="351" r="8"/>
  <circle class="node n-memory"   cx="321" cy="261" r="8"/>
  <circle class="node n-score"    cx="347" cy="150" r="8"/>

  <g class="mono" font-size="13" fill="var(--ink)">
    <text x="450" y="81"  class="hl" text-anchor="middle">planner</text>
    <text x="568" y="141" class="hl">contextBuilder</text>
    <text x="596" y="265" class="hl">reviewer</text>
    <text x="507" y="382" class="hl" text-anchor="middle">retryPolicy</text>
    <text x="393" y="382" class="hl" text-anchor="middle">toolPolicy</text>
    <text x="305" y="265" class="hl" text-anchor="end">memoryPolicy</text>
    <text x="332" y="141" class="hl" text-anchor="end">scorePolicy</text>
  </g>

  <!-- THE FROZEN MODEL: a still crystal. Nothing here ever animates. -->
  <g>
    <polygon points="335,232 388,179 512,179 565,232 512,285 388,285"
             fill="var(--core-fill)" stroke="var(--cyan)" stroke-width="1.8"/>
    <!-- crystal facets -->
    <g stroke="var(--facet)" stroke-width="1" opacity=".45">
      <path d="M335 232 L472 212"/>
      <path d="M388 179 L472 212"/>
      <path d="M565 232 L472 212"/>
      <path d="M388 285 L472 212"/>
      <path d="M512 285 L472 212"/>
    </g>
    <!-- frost ticks -->
    <g stroke="var(--cyan)" stroke-width="1.5" opacity=".55" stroke-linecap="round">
      <path d="M329 232 h-8"/>
      <path d="M571 232 h6"/>
      <path d="M384 174 l-5 -5"/>
      <path d="M516 174 l5 -5"/>
      <path d="M384 290 l-5 5"/>
      <path d="M516 290 l5 5"/>
    </g>
    <!-- lock -->
    <g transform="translate(408,191)">
      <path d="M4 9 V6 a5 5 0 0 1 10 0 V9" fill="none" stroke="var(--cyan)" stroke-width="1.8"/>
      <rect x="1" y="9" width="16" height="12" rx="2.5" fill="var(--cyan)"/>
    </g>
    <text x="432" y="210" class="mono hlc" font-size="12" letter-spacing="2.5" fill="var(--cyan)">FROZEN</text>
    <text x="450" y="251" class="serif hlc" font-size="27" font-weight="bold" text-anchor="middle" fill="var(--ink)">MODEL</text>
  </g>
  <text x="450" y="300" class="mono hl" font-size="12" text-anchor="middle" fill="var(--muted)">the Claude you already have</text>
  <text x="450" y="318" class="mono hl" font-size="12" text-anchor="middle" fill="var(--cyan)" opacity=".9">never retrained or swapped</text>

  <!-- the harness stands on four pillars -->
  <path d="M450 371 V403" stroke="var(--ridge)" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>
  <line x1="70" y1="406" x2="830" y2="406" stroke="var(--ridge)" stroke-width="1"/>
  <rect class="bar bar-1" x="136" y="404" width="28" height="3.5" rx="1.75" fill="var(--amber-stroke)" opacity=".45"/>
  <rect class="bar bar-2" x="336" y="404" width="28" height="3.5" rx="1.75" fill="var(--green)" opacity=".45"/>
  <rect class="bar bar-3" x="536" y="404" width="28" height="3.5" rx="1.75" fill="var(--faint)" opacity=".45"/>
  <rect class="bar bar-4" x="736" y="404" width="28" height="3.5" rx="1.75" fill="var(--green)" opacity=".45"/>

  <!-- route -->
  <g transform="translate(150,430)" fill="none" stroke="var(--amber-stroke)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-16 8 H-6"/>
    <path d="M-6 8 C2 8 2 -6 12 -6"/>
    <path d="M9 -9 L14 -6 L9 -3"/>
    <path d="M-6 8 C2 8 4 8 12 8"/>
    <path d="M9 5 L14 8 L9 11"/>
  </g>
  <!-- evolve -->
  <g transform="translate(350,430)" fill="none" stroke-linecap="round">
    <path d="M0 14 V2" stroke="var(--muted)" stroke-width="2"/>
    <path d="M0 7 C-3 3 -6 1 -9 -2" stroke="var(--muted)" stroke-width="2"/>
    <path d="M0 7 C3 3 7 0 10 -3" stroke="var(--muted)" stroke-width="2"/>
    <path d="M-14 -8 l6 6 M-8 -8 l-6 6" stroke="var(--red)" stroke-width="1.8"/>
    <circle cx="12" cy="-5" r="3" fill="var(--green)" stroke="none"/>
  </g>
  <!-- orchestrate -->
  <g transform="translate(550,430)" stroke="var(--faint)" stroke-width="1.8" fill="var(--faint)">
    <path d="M0 6 L-13 -5 M0 6 L0 -10 M0 6 L13 -5" fill="none"/>
    <circle cx="0" cy="7" r="3.2" stroke="none"/>
    <circle cx="-13" cy="-6" r="2.5" stroke="none"/>
    <circle cx="0" cy="-11" r="2.5" stroke="none"/>
    <circle cx="13" cy="-6" r="2.5" stroke="none"/>
  </g>
  <!-- verify -->
  <g transform="translate(750,430)" fill="none" stroke="var(--green)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -11 C4 -8 8 -7 11 -7 V1 C11 8 6 12 0 15 C-6 12 -11 8 -11 1 V-7 C-8 -7 -4 -8 0 -11 Z" stroke-width="2"/>
    <path d="M-4.5 1.5 L-1 5.5 L5.5 -2.5" stroke-width="2.2"/>
  </g>

  <g class="mono" text-anchor="middle">
    <text x="150" y="462" font-size="12" letter-spacing="1.5" fill="var(--ink)">ROUTE</text>
    <text x="350" y="462" font-size="12" letter-spacing="1.5" fill="var(--ink)">EVOLVE</text>
    <text x="550" y="462" font-size="12" letter-spacing="1.5" fill="var(--ink)">ORCHESTRATE</text>
    <text x="750" y="462" font-size="12" letter-spacing="1.5" fill="var(--ink)">VERIFY</text>
    <text x="150" y="478" font-size="12" fill="var(--muted)">cost-optimal model selection</text>
    <text x="350" y="478" font-size="12" fill="var(--muted)">self-improving harness</text>
    <text x="550" y="478" font-size="12" fill="var(--muted)">agents, swarms, MCP</text>
    <text x="750" y="478" font-size="12" fill="var(--muted)">provenance + safety gate</text>
  </g>

  <!-- payoff -->
  <line x1="90" y1="497" x2="810" y2="497" stroke="var(--ridge)" stroke-width="1"/>
  <text x="450" y="527" class="serif" font-size="19" font-style="italic" text-anchor="middle" fill="var(--ink)">A cheap model in a good harness ≈ a frontier model, for less.</text>
  <text x="450" y="548" class="mono" font-size="12" text-anchor="middle" fill="var(--muted)">per ADR-076 — 28.5% cheaper at 98.1% bar-compliance</text>
</svg>

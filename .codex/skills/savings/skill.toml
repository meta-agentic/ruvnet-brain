# Codex skill: the MetaHarness routing ledger, inline.
#
# Shape follows rUv's own convention — metaharness/.codex/skills/example-harness/skill.toml
# for the shell-dispatch variant (metaharness/.codex/skills/repo-genome/skill.toml is the
# mcp_tool variant).
#
# This skill is a thin wrapper over ONE real script, which is why it can dispatch at all:
# plugin/skills/savings/SKILL.md step 1 is literally `node scripts/metaharness-receipts.mjs`,
# and "the receipts script already draws the full card". `npx ruvnet-brain` copies that script
# to ~/.claude/model-router/bin/ — a stable path chosen precisely because the npx dir vanishes.
# $HOME keeps this portable; no developer path is baked in.

[skill]
name = "savings"
description = "Show the MetaHarness routing ledger inline — which model each task was routed to, what it displaced, and the percentage + dollars saved — plus the learned router's training state. Use when the user says \"savings\", \"show my savings\", \"metaharness report\", \"routing report\", \"routing receipts\", \"who is the router choosing\", \"how much has routing saved me\", or \"show me the routing\". All numbers come from the real receipts log; never fake or extrapolate a number."
homepage = "https://github.com/stuinfla/ruvnet-brain"
license = "MIT"

# No MCP tool backs this one — the brain's server serves only search_ruvnet — so it dispatches
# to the receipts viewer directly. If the script is absent, routing was never installed: the
# honest answer is "nothing routed yet", not a fabricated total.
[dispatch]
type = "shell"
command = "node \"$HOME/.claude/model-router/bin/metaharness-receipts.mjs\""

[command]
name = "savings"
synopsis = "What has cost-routing actually saved you? Real receipts, no extrapolation."

[catalog]
tags = ["routing", "cost", "metaharness", "receipts", "ledger", "savings"]
